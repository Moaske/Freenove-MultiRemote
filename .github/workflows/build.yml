name: Build firmware and tray app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: |
          set -o pipefail
          export PLATFORMIO_BUILD_FLAGS="-DFW_VERSION=\\\"${GITHUB_SHA::7}\\\""
          if ! pio run -e freenove28 2>&1 | tee build.log; then
            # Compiler errors as one annotation, readable from the run page and the API.
            MSG=$(grep -E "error|Error|undefined reference" build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build failed::$MSG"
            exit 1
          fi

      - name: Collect firmware
        run: |
          set -e
          B=.pio/build/freenove28
          APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          mkdir -p out
          cp $B/firmware.bin out/firmware.bin
          # One file for a first install: everything at offset 0x0.
          # (This also clears saved settings and the touch calibration.)
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32 merge_bin \
            -o out/merged-full-install.bin \
            --flash_mode dio --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 "$APP0" 0x10000 $B/firmware.bin
          cat > out/FLASHING.txt <<'EOF'
          First install: flash merged-full-install.bin at offset 0x0
          Updates:       flash firmware.bin at offset 0x10000 (keeps settings)
          Browser tool:  https://espressif.github.io/esptool-js/
          EOF

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: freenove-multiremote-firmware
          path: out/

  tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build tray app
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet publish tray/MultiRemoteTray.csproj -c Release -r win-x64 \
               --self-contained true -p:PublishSingleFile=true \
               -p:IncludeNativeLibrariesForSelfExtract=true \
               -p:EnableCompressionInSingleFile=true -o out 2>&1 | tee build.log; then
            MSG=$(grep -E "error" build.log | sort -u | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Tray app build failed::$MSG"
            exit 1
          fi

      - name: Upload tray app
        uses: actions/upload-artifact@v4
        with:
          name: multiremote-tray-app
          path: out/MultiRemoteTray.exe
