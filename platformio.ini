; Freenove MultiRemote — firmware for the Freenove ESP32 Display 2.8"
; (FNK0114B_2P8: ESP32-WROOM-32E, ST7789 240x320, XPT2046 resistive touch).
;
; Built by GitHub Actions (.github/workflows/build.yml); the firmware comes out
; in the run's Artifacts. See README.md for flashing.

[env:freenove28]
; Pinned: the same platform the SquachWatch-CYD-BATT fork runs on this board
; (Arduino core 2.0.14). Core 3.x changes the LEDC (backlight) API.
platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino

; One big app slot: BLE (next step) plus fonts need more than the default
; 1.2 MB. No OTA, no SPIFFS: the .ir files live on the SD card.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    ; The registry copy of XPT2046_Touchscreen is a 2019 alpha; use master.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    crankyoldgit/IRremoteESP8266@2.8.6

build_flags =
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/board_setup.h
    -DCORE_DEBUG_LEVEL=0
